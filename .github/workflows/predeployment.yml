name: Pre-deployment verification
on:
  push:
    branches: [codex/predeployment-completion]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run lint
      - name: Production build
        run: npm run build
